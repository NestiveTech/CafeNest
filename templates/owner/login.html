<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - CafeNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-brown: #8B4513;
            --dark-brown: #6B2213;
            --accent-coral: #E2725B;
            --light-cream: #FFF5E6;
            --cream-bg: #FFFAF5;
            --tan: #DEC2AF;
            --sienna: #A0522D;
        }
        
        /* Custom Scrollbar */
        html {
            scrollbar-width: thin;
            scrollbar-color: var(--accent-coral) var(--light-cream);
            scrollbar-gutter: stable both-edges; /* Prevents layout shift */
        }
        
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: linear-gradient(180deg, var(--light-cream) 0%, var(--tan) 100%);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-coral) 0%, var(--primary-brown) 100%);
            border-radius: 10px;
            border: 2px solid var(--light-cream);
            transition: all 0.3s ease;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--primary-brown) 0%, var(--dark-brown) 100%);
            box-shadow: 0 0 10px rgba(226, 114, 91, 0.5);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B4513 0%, #6B2213 50%, #4A1810 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(226, 114, 91, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            z-index: 0;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Navigation Bar */
        .navbar {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.95) 0%, rgba(107, 34, 19, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 50px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(107, 34, 19, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }
        
        .navbar-brand:hover {
            transform: scale(1.05);
        }
        
        .navbar-brand i {
            font-size: 24px;
            color: var(--accent-coral);
        }
        
        .navbar-brand .highlight {
            color: var(--accent-coral);
            font-weight: 800;
        }
        
        .navbar-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .navbar-menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .navbar-menu a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--accent-coral);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        
        .navbar-menu a:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .navbar-menu a:hover::before {
            width: 70%;
        }
        
        .navbar-btn {
            background: rgba(226, 114, 91, 0.2) !important;
            border: 2px solid var(--accent-coral);
            font-weight: 600;
        }
        
        .navbar-btn:hover {
            background: var(--accent-coral) !important;
            border-color: white;
            box-shadow: 0 4px 15px rgba(226, 114, 91, 0.4);
        }
        
        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .hamburger span {
            width: 28px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }
        
        .hamburger.active span:nth-child(2) {
            opacity: 0;
            transform: translateX(20px);
        }
        
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }
        
        /* Mobile Menu Overlay */
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .mobile-menu-overlay.active {
            display: block;
            opacity: 1;
        }
        
        /* Mobile Menu */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            max-width: 85vw;
            height: 100vh;
            background: linear-gradient(180deg, var(--primary-brown) 0%, var(--dark-brown) 100%);
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.3);
            z-index: 999;
            padding: 80px 30px 30px;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow-y: auto;
        }
        
        .mobile-menu.active {
            right: 0;
        }
        
        .mobile-menu-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .mobile-menu-items a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 15px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .mobile-menu-items a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        
        .mobile-menu-items a i {
            font-size: 20px;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px;
            position: relative;
            z-index: 1;
        }
        
        /* Login Container - Modern Glassmorphism */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(107, 34, 19, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 50px 45px;
            max-width: 480px;
            width: 100%;
            border: 2px solid rgba(226, 114, 91, 0.3);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(226, 114, 91, 0.08) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }
        
        .logo-icon {
            font-size: 56px;
            color: var(--accent-coral);
            margin-bottom: 15px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .logo-section h1 {
            color: var(--primary-brown);
            font-size: 40px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .logo-section .highlight {
            color: var(--accent-coral);
        }
        
        .logo-section p {
            color: var(--sienna);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Google Button */
        .google-btn {
            width: 100%;
            padding: 16px;
            background: white;
            border: 2px solid var(--tan);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--dark-brown);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .google-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: var(--light-cream);
            transition: width 0.6s ease, height 0.6s ease;
            transform: translate(-50%, -50%);
        }
        
        .google-btn:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .google-btn svg,
        .google-btn span {
            position: relative;
            z-index: 1;
        }
        
        .google-btn:hover {
            border-color: var(--accent-coral);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(226, 114, 91, 0.3);
        }
        
        /* Divider */
        .divider {
            text-align: center;
            margin: 35px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--tan) 50%, transparent 100%);
        }
        
        .divider span {
            background: white;
            padding: 0 20px;
            position: relative;
            color: var(--sienna);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Form Group */
        .form-group {
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }
        
        .form-group label {
            display: block;
            color: var(--dark-brown);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group label i {
            color: var(--accent-coral);
            font-size: 16px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--tan);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-coral);
            box-shadow: 0 0 0 4px rgba(226, 114, 91, 0.15);
            transform: translateY(-2px);
        }
        
        .form-group input::placeholder {
            color: #b8a89f;
        }
        
        /* Primary Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-coral) 0%, var(--primary-brown) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(226, 114, 91, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: width 0.6s ease, height 0.6s ease;
            transform: translate(-50%, -50%);
        }
        
        .btn-primary:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .btn-primary i {
            position: relative;
            z-index: 1;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(226, 114, 91, 0.5);
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        /* Signup Link */
        .signup-link {
            text-align: center;
            margin-top: 30px;
            color: var(--dark-brown);
            font-size: 15px;
            position: relative;
            z-index: 1;
        }
        
        .signup-link a {
            color: var(--accent-coral);
            text-decoration: none;
            font-weight: 700;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .signup-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-coral);
            transition: width 0.3s ease;
        }
        
        .signup-link a:hover::after {
            width: 100%;
        }
        
        .signup-link a:hover {
            color: var(--dark-brown);
        }
        
        /* Messages */
        .messages {
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }
        
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            animation: slideIn 0.4s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .alert::before {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 20px;
        }
        
        .alert-success {
            background: linear-gradient(135deg, #C8E6C9 0%, #A5D6A7 100%);
            color: #1B5E20;
            border: 2px solid #81C784;
        }
        
        .alert-success::before {
            content: "\f058";
        }
        
        .alert-error {
            background: linear-gradient(135deg, #FFCDD2 0%, #EF9A9A 100%);
            color: #B71C1C;
            border: 2px solid #E57373;
        }
        
        .alert-error::before {
            content: "\f06a";
        }
        
        /* Back to Home Link */
        .back-home {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 25px;
        }
        
        .back-home a {
            color: var(--sienna);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .back-home a:hover {
            color: var(--accent-coral);
            transform: translateX(-5px);
        }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .navbar {
                padding: 15px 30px;
            }
            
            .hamburger {
                display: flex;
            }
            
            .navbar-menu {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            
            .navbar-brand {
                font-size: 24px;
            }
            
            .navbar-brand i {
                font-size: 20px;
            }
            
            .main-content {
                padding: 90px 15px 30px;
            }
            
            .login-container {
                padding: 40px 30px;
                border-radius: 20px;
            }
            
            .logo-section h1 {
                font-size: 36px;
            }
            
            .logo-icon {
                font-size: 48px;
            }
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }
            
            .logo-section h1 {
                font-size: 32px;
            }
            
            .logo-section p {
                font-size: 14px;
            }
            
            .google-btn,
            .btn-primary {
                padding: 14px;
                font-size: 15px;
            }
        }


        /* ============================================
   COMPREHENSIVE RESPONSIVE DESIGN
   Works from 4K displays to mobile phones
   ============================================ */

/* Extra Large Desktop (1920px+) */
@media (min-width: 1920px) {
  .container { max-width: 1600px; }
}

/* Large Desktop (1440-1919px) */
@media (min-width: 1440px) and (max-width: 1919px) {
  .container { max-width: 1400px; }
}

/* Standard Desktop (1200-1439px) */
@media (min-width: 1200px) and (max-width: 1439px) {
  .container { max-width: 1140px; padding: 100px 25px 40px; }
}

/* Laptop/Small Desktop (1024-1199px) - HAMBURGER STARTS */
@media (min-width: 1024px) and (max-width: 1199px) {
  .container { max-width: 960px; padding: 96px 20px 32px; }
  .nav-links { display: none !important; }
  .hamburger { display: inline-flex !important; }
  
  /* Adjust grids */
  .stats-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .content-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
}

/* Tablet Portrait (768-1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  .nav-links { display: none !important; }
  .hamburger { display: inline-flex !important; }
  .container { padding: 90px 20px 30px; }
  
  /* Single column layouts */
  .content-grid,
  .form-row,
  .stats-grid { grid-template-columns: 1fr !important; gap: 16px; }
  
  /* Adjust cards */
  .form-container,
  .table-container,
  .page-header { padding: 24px 20px !important; border-radius: 16px !important; }
  
  /* Typography adjustments */
  .page-header h2,
  .form-container h2 { font-size: 24px !important; }
  
  /* Tables */
  .table-container { overflow-x: auto; }
  table { min-width: 600px; }
  th, td { padding: 12px 10px !important; font-size: 13px !important; }
}

/* Mobile Large (640-767px) */
@media (min-width: 640px) and (max-width: 767px) {
  .nav-links { display: none !important; }
  .hamburger { display: inline-flex !important; }
  .container { padding: 90px 16px 24px; }
  
  /* Force single column */
  .content-grid,
  .form-row,
  .stats-grid,
  .table-grid { grid-template-columns: 1fr !important; gap: 14px; }
  
  /* Compact cards */
  .form-container,
  .table-container,
  .page-header { padding: 20px 16px !important; border-radius: 14px !important; }
  
  /* Typography */
  .navbar h1,
  .brand { font-size: 20px !important; }
  .page-header h2 { font-size: 22px !important; }
  
  /* Buttons */
  .btn { padding: 10px 18px !important; font-size: 13px !important; }
  .form-actions { flex-direction: column; }
  .form-actions .btn { width: 100%; }
  
  /* Tables - force scroll */
  table { min-width: 550px; }
  th, td { padding: 10px 8px !important; font-size: 12px !important; }
}

/* Mobile Medium (480-639px) */
@media (min-width: 480px) and (max-width: 639px) {
  .nav-links { display: none !important; }
  .hamburger { display: inline-flex !important; }
  .container { padding: 85px 14px 20px; }
  .nav-inner { padding: 0 20px; }
  
  /* Ultra compact */
  .form-container,
  .table-container,
  .page-header { padding: 18px 14px !important; border-radius: 12px !important; }
  
  /* Typography */
  .navbar h1,
  .brand { font-size: 18px !important; }
  .page-header h2 { font-size: 20px !important; }
  .stat-card h3,
  .stat-card .value { font-size: 28px !important; }
  
  /* Buttons full width */
  .btn,
  .btn-sm { width: 100%; justify-content: center; padding: 10px 16px !important; }
  .actions,
  .form-actions,
  .header-actions { flex-direction: column; gap: 8px; }
  
  /* Tables */
  table { min-width: 480px; }
  th, td { padding: 8px 6px !important; font-size: 11px !important; }
}

/* Mobile Small (360-479px) */
@media (min-width: 360px) and (max-width: 479px) {
  .nav-links { display: none !important; }
  .hamburger { display: inline-flex !important; }
  .container { padding: 80px 12px 16px; }
  .nav-inner { padding: 0 16px; }
  
  /* Extra compact */
  .form-container,
  .table-container,
  .page-header { padding: 16px 12px !important; border-radius: 10px !important; }
  
  /* Typography */
  .navbar h1,
  .brand { font-size: 16px !important; }
  .hamburger { width: 40px !important; height: 40px !important; }
  .page-header h2 { font-size: 18px !important; }
  .stat-card h3,
  .stat-card .value { font-size: 24px !important; }
  
  /* Compact inputs */
  .form-group input,
  .form-group select,
  .form-group textarea { padding: 10px 12px !important; font-size: 14px !important; }
  
  /* Buttons */
  .btn { padding: 9px 14px !important; font-size: 12px !important; }
  
  /* Tables ultra compact */
  table { min-width: 420px; }
  th, td { padding: 6px 4px !important; font-size: 10px !important; }
  .badge { font-size: 10px !important; padding: 4px 8px !important; }
}

/* Mobile Extra Small (320-359px) */
@media (max-width: 359px) {
  .nav-links { display: none !important; }
  .hamburger { display: inline-flex !important; }
  .container { padding: 75px 10px 12px; }
  .nav-inner { padding: 0 12px; }
  
  /* Minimal spacing */
  .form-container,
  .table-container,
  .page-header { padding: 14px 10px !important; border-radius: 8px !important; }
  
  /* Typography tiny */
  .navbar h1,
  .brand { font-size: 15px !important; }
  .hamburger { width: 36px !important; height: 36px !important; }
  .hamburger span { width: 18px !important; }
  .page-header h2 { font-size: 16px !important; }
  .stat-card h3,
  .stat-card .value { font-size: 22px !important; }
  .stat-card p { font-size: 11px !important; }
  
  /* Compact inputs */
  .form-group input,
  .form-group select,
  .form-group textarea { padding: 8px 10px !important; font-size: 13px !important; }
  
  /* Buttons minimal */
  .btn { padding: 8px 12px !important; font-size: 11px !important; }
  
  /* Tables minimal */
  table { min-width: 360px; }
  th, td { padding: 5px 3px !important; font-size: 9px !important; }
  .badge { font-size: 9px !important; padding: 3px 6px !important; }
}

/* ============================================
   UNIVERSAL FIXES FOR ALL ELEMENTS
   ============================================ */

/* Prevent horizontal overflow */
* {
  max-width: 100%;
  word-wrap: break-word;
}

/* Images responsive */
img {
  max-width: 100%;
  height: auto;
}

/* Flexible containers */
.container {
  width: 100%;
  box-sizing: border-box;
}

/* Touch-friendly buttons on mobile */
@media (max-width: 1023px) {
  .btn,
  .btn-sm,
  button,
  a[class*="btn"] {
    min-height: 44px; /* Apple's recommended touch target */
    touch-action: manipulation; /* Disable double-tap zoom */
  }
}

/* Optimize drawer for all sizes */
@media (max-width: 1023px) {
  .drawer {
    width: min(320px, 85vw);
  }
}

/* Ensure stat cards stack nicely */
@media (max-width: 767px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}

@media (max-width: 479px) {
  .stats-grid {
    grid-template-columns: 1fr !important;
  }
}

    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="{% url 'home' %}" class="navbar-brand" aria-label="CafeNest Home">
                <i class="fas fa-coffee"></i>
                Cafe<span class="highlight">Nest</span>
            </a>
            
            <!-- Desktop Menu -->
            <div class="navbar-menu">
                <a href="{% url 'home' %}">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="{% url 'owner_signup' %}" class="navbar-btn">
                    <i class="fas fa-user-plus"></i> Sign Up
                </a>
            </div>
            
            <!-- Hamburger Menu Button -->
            <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="overlay" onclick="toggleMobileMenu()"></div>

    <!-- Mobile Menu -->
    <aside class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation">
        <div class="mobile-menu-items">
            <a href="{% url 'home' %}">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="{% url 'owner_signup' %}">
                <i class="fas fa-user-plus"></i> Sign Up
            </a>
            <a href="{% url 'manager_login' %}">
                <i class="fas fa-user-tie"></i> Manager Login
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="login-container">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-coffee"></i>
                </div>
                <h1>Cafe<span class="highlight">Nest</span></h1>
                <p>Owner Portal</p>
            </div>
            
            {% if messages %}
            <div class="messages" role="alert">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
            <a href="/accounts/google/login/?process=login" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Sign in with Google</span>
            </a>
            
            <div class="divider">
                <span>Or</span>
            </div>
            
            <form method="POST" action="{% url 'account_login' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_login">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" name="login" id="id_login" placeholder="Enter your email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="id_password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" name="password" id="id_password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>
            </form>
            
            <div class="signup-link">
                Don't have an account? <a href="{% url 'owner_signup' %}">Sign up here</a>
            </div>
            
            <div class="back-home">
                <a href="{% url 'home' %}">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const hamburger = document.getElementById('hamburger');
            const mobileMenu = document.getElementById('mobileMenu');
            const overlay = document.getElementById('overlay');
            
            const isActive = hamburger.classList.contains('active');
            
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            overlay.classList.toggle('active');
            
            // Update aria-expanded
            hamburger.setAttribute('aria-expanded', !isActive);
            
            // Prevent body scroll when menu is open
            document.body.style.overflow = isActive ? '' : 'hidden';
        }
        
        // Close mobile menu when clicking on a link
        document.querySelectorAll('.mobile-menu-items a').forEach(link => {
            link.addEventListener('click', function() {
                toggleMobileMenu();
            });
        });
        
        // Close menu on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('hamburger').classList.contains('active')) {
                toggleMobileMenu();
            }
        });
        
        // Form validation feedback
        const inputs = document.querySelectorAll('input[required]');
        
        inputs.forEach(input => {
            input.addEventListener('invalid', function(e) {
                e.preventDefault();
                this.style.borderColor = '#E57373';
                this.style.animation = 'shake 0.5s';
            });
            
            input.addEventListener('input', function() {
                if (this.validity.valid) {
                    this.style.borderColor = '';
                    this.style.animation = '';
                }
            });
        });
        
        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
